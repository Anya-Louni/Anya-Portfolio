name: Keep the database awake

# Supabase pauses a free project that goes a week without a request, and
# waking it up is a manual button in their dashboard. A portfolio can easily
# go quiet for a week, so this makes one cheap read every other day and the
# project never goes to sleep.
#
# It reads the fish table, which visitors read anyway, using the same public
# anon key the site ships with. That key is written in below rather than kept
# as a secret, because it is already in the built bundle that every visitor
# downloads: hiding it here would protect nothing. The database decides what
# it may do, and reading fish is all a visitor may do. A secret of the same
# name overrides it if you ever rotate the key.
#
# The service role key is the opposite and must only ever live in Actions
# secrets. It is not used here.

on:
  schedule:
    # 06:00 UTC, every other day
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          URL: ${{ secrets.SUPABASE_URL || 'https://YOUR-PROJECT.supabase.co' }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY || '${{ secrets.SUPABASE_ANON_KEY }}' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/fish?select=id&limit=1")
          echo "Supabase answered $code"
          # 200 is awake. Anything else is worth seeing in the run log, but a
          # red cross every other day would train you to ignore this, so it
          # only fails when the project is actually gone.
          if [ "$code" = "000" ] || [ "$code" = "404" ]; then
            echo "::error::No answer, or no fish table. The project is paused, deleted, or the tables were never created. Open the Supabase dashboard."
            exit 1
          fi
