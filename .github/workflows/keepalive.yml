name: Keep the database awake

# Supabase pauses a free project that goes a week without a request, and
# waking it up is a manual button in their dashboard. A portfolio can easily
# go quiet for a week, so this makes one cheap read every other day and the
# project never goes to sleep.
#
# It reads the fish table, which visitors read anyway, using the anon key.
#
# The key lives in a repository variable, not in this file. The anon key is
# public by design and ships inside the bundle, so writing it here leaked
# nothing, but secret scanners cannot tell one JWT from another and flag it
# as an incident. A variable keeps the scanners quiet and means rotating the
# key never needs a commit.
#
# Settings > Secrets and variables > Actions > Variables:
#   SUPABASE_URL       https://<your-project>.supabase.co
#   SUPABASE_ANON_KEY  the anon public key
#
# The service role key is a real secret and belongs in Secrets, never in
# Variables and never in this file. It is not used here.

on:
  schedule:
    # 06:00 UTC, every other day
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY are not set. See README-NOTES.md."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/fish?select=id&limit=1")
          echo "Supabase answered $code"
          # 200 is awake. Anything else is worth seeing in the run log, but a
          # red cross every other day would train you to ignore this, so it
          # only fails when the project is actually gone.
          if [ "$code" = "000" ] || [ "$code" = "404" ]; then
            echo "::error::No answer, or no fish table. The project is paused, deleted, or the tables were never created. Open the Supabase dashboard."
            exit 1
          fi
